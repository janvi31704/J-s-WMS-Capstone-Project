<div class="department-page">

  <!-- HEADER -->

  <div class="top-section">

    <h1>
      Department Management
    </h1>

  </div>

  <!-- FORM -->

  <div
    class="department-form"
    *ngIf="
      authService.isAdmin()
    ">

    <mat-form-field appearance="outline">

      <mat-label>
        Department Name
      </mat-label>

      <input
        matInput
        [(ngModel)]="
          departmentForm.departmentName
        ">

    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      (click)="saveDepartment()">

      {{
        isEditMode
        ? 'Update'
        : 'Add'
      }}
      Department

    </button>

  </div>

  <!-- TABLE -->

  <div class="table-container">

    <table
      mat-table
      [dataSource]="departmentList">

      <!-- ID -->

      <ng-container
        matColumnDef="departmentId">

        <th
          mat-header-cell
          *matHeaderCellDef>

          ID

        </th>

        <td
          mat-cell
          *matCellDef="let item">

          {{ item.departmentId }}

        </td>

      </ng-container>

      <!-- NAME -->

      <ng-container
        matColumnDef="departmentName">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Department Name

        </th>

        <td
          mat-cell
          *matCellDef="let item">

          {{ item.departmentName }}

        </td>

      </ng-container>

      <!-- ACTIONS -->

      <ng-container
        matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Actions

        </th>

        <td
          mat-cell
          *matCellDef="let item">

          <div
            *ngIf="
              authService.isAdmin()
            ">

            <button
              mat-button
              color="primary"
              (click)="editDepartment(
                item
              )">

              Edit

            </button>

            <button
              mat-button
              color="warn"
              (click)="deleteDepartment(
                item.departmentId
              )">

              Delete

            </button>

          </div>

        </td>

      </ng-container>

      <!-- HEADER -->

      <tr
        mat-header-row
        *matHeaderRowDef="
          displayedColumns
        ">
      </tr>

      <!-- ROWS -->

      <tr
        mat-row
        *matRowDef="
          let row;
          columns:
            displayedColumns;
        ">
      </tr>

    </table>

  </div>

</div>
