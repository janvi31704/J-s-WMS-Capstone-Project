<div class="department-page">

  <!-- HEADER -->

  <div class="top-section">

  <h1>
    Department Management
  </h1>

  <button
    mat-raised-button
    color="primary"
    (click)="openDialog()">

    Add Department

  </button>

</div>
  <!-- FORM -->

  
  <!-- TABLE -->

  <div class="table-container">

    <table
      mat-table
      [dataSource]="filteredDepartments">

      <!-- ID -->

      <ng-container
        matColumnDef="departmentId">

        <th
          mat-header-cell
          *matHeaderCellDef>

          ID

        </th>

        <td
          mat-cell
          *matCellDef="let item">

          {{ item.departmentId }}

        </td>

      </ng-container>

      <!-- NAME -->

      <ng-container
        matColumnDef="departmentName">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Department Name

        </th>

        <td
          mat-cell
          *matCellDef="let item">

          {{ item.departmentName }}

        </td>

      </ng-container>

      <!-- ACTIONS -->

      <ng-container
        matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Actions

        </th>

        <td
          mat-cell
          *matCellDef="let item">

          <div
            *ngIf="
              authService.isAdmin()
            ">

            <button
              mat-button
              color="primary"
              (click)="openDialog(item)">

              Edit

            </button>

            <button
              mat-button
              color="warn"
              (click)="deleteDepartment(
                item.departmentId
              )">

              Delete

            </button>

          </div>

        </td>

      </ng-container>

      <!-- HEADER -->

      <tr
        mat-header-row
        *matHeaderRowDef="
          displayedColumns
        ">
      </tr>

      <!-- ROWS -->

      <tr
        mat-row
        *matRowDef="
          let row;
          columns:
            displayedColumns;
        ">
      </tr>

    </table>

  </div>

</div>
