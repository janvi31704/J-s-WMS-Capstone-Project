<div class="login-page">

  <div class="login-card">

    <!-- LEFT SIDE -->

    <div class="left-section">

      <img
  src="https://th.bing.com/th/id/OIP.xd-nNh9tKlkrEvKx_fNW4wHaEJ?w=304&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
  alt="login illustration">

    </div>

    <!-- RIGHT SIDE -->

    <div class="right-section">

      <h1>Welcome Back</h1>

      <div class="brand">

  <div class="logo-circle">
    JW
  </div>

  <h2>J's WMS</h2>

</div>

      <p class="subtitle">
        Workforce Management System
      </p>

      <form (ngSubmit)="login()">

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>Username</mat-label>

          <input
            matInput
            [(ngModel)]="loginData.username"
            name="username"
            required>

        </mat-form-field>

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>Password</mat-label>

          <input
            matInput
            type="password"
            [(ngModel)]="loginData.password"
            name="password"
            required>

        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="login-btn"
          type="submit">

          Login

        </button>

      </form>

      <p class="error">
        {{ errorMessage }}
      </p>

    </div>

  </div>

</div>
