<div class="role-page">

  <div class="top-section">

    <h1>
      Role Management
    </h1>

  </div>

  <!-- FORM -->

  <div class="role-form">

    <mat-form-field appearance="outline">

      <mat-label>
        Role Name
      </mat-label>

      <input
        matInput
        [(ngModel)]="roleForm.roleName">

    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      (click)="saveRole()">

      {{ isEditMode
        ? 'Update Role'
        : 'Add Role'
      }}

    </button>

  </div>

  <!-- SEARCH -->

  <mat-form-field
    appearance="outline"
    class="search-field">

    <mat-label>
      Search Role
    </mat-label>

    <input
      matInput
      [(ngModel)]="searchText"
      (input)="searchRoles()">

  </mat-form-field>

  <!-- TABLE -->

  <div class="table-container">

    <table
      mat-table
      [dataSource]="filteredRoles">

      <ng-container
        matColumnDef="roleId">

        <th
          mat-header-cell
          *matHeaderCellDef>

          ID

        </th>

        <td
          mat-cell
          *matCellDef="let role">

          {{ role.roleId }}

        </td>

      </ng-container>

      <ng-container
        matColumnDef="roleName">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Role Name

        </th>

        <td
          mat-cell
          *matCellDef="let role">

          {{ role.roleName }}

        </td>

      </ng-container>

      <ng-container
        matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Actions

        </th>

        <td
          mat-cell
          *matCellDef="let role">

          <button
            mat-button
            color="primary"
            (click)="editRole(role)">

            Edit

          </button>

          <button
            mat-button
            color="warn"
            (click)="deleteRole(role.roleId)">

            Delete

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        ">
      </tr>

    </table>

  </div>

</div>
